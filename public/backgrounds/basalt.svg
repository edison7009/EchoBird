<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720">
  <filter id="rock" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.0065" numOctaves="5" stitchTiles="stitch" seed="4"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="0.13" intercept="0.018"/>
      <feFuncG type="linear" slope="0.13" intercept="0.018"/>
      <feFuncB type="linear" slope="0.13" intercept="0.018"/>
    </feComponentTransfer>
  </filter>
  <rect width="720" height="720" filter="url(#rock)"/>
</svg>
