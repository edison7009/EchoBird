[package]
name = "echo-supply-renderer"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
js-sys = "=0.3.104"
web-sys = { version = "=0.3.104", features = ["Window", "Document", "HtmlCanvasElement", "HtmlImageElement", "CanvasRenderingContext2d", "CanvasGradient", "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlBuffer", "WebGlTexture", "WebGlUniformLocation", "WebGlVertexArrayObject", "TextMetrics"] }
