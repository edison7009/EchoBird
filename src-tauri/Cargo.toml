[package]
name = "echobird"
version = "6.2.9"
description = "The Nexus for Models, Agents & Vibe Coding"
authors = ["Echobird Team"]
license = "MIT"
repository = "https://echobird.ai/"
edition = "2021"
rust-version = "1.93"

[lib]
name = "echobird_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
# Tauri core. `tauri::generate_context!()` (in src/lib.rs) expands against
# this crate's CARGO_MANIFEST_DIR to find tauri.conf.json; the Builder,
# Manager, tray, and menu APIs are used throughout services/.
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "macos-private-api"] }

# Tauri plugins. All are direct deps of this crate (which owns the
# tauri-build step) so tauri-build's permission validator resolves every
# capability in capabilities/*.json.
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
# Autostart at OS boot (launch-at-login). Registered with a `--minimized`
# arg so a boot launch starts hidden in the tray (see app_ready + the 1s
# fallback show in lib.rs). Exposes JS enable/disable/isEnabled, so it
# needs the autostart:default capability entry.
tauri-plugin-autostart = "2"
# Single-instance guard: focus the running window instead of spawning a
# second process when EchoBird is launched again (e.g. double-clicking the
# desktop shortcut while it's minimized to tray). Exposes no JS commands, so
# it needs no capability entry.
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
plist = "1"
toml_edit = "0.25"
jsonc-parser = { version = "0.33.1", features = ["serde", "cst", "serde_json"] }
# Qoder desktop stores model selection in LevelDB on all supported platforms;
# Cline Desktop also uses it on Windows.
rusty-leveldb = "4.0.1"
# YAML read-merge-write for DeepSeek Harness (`~/.dsh/settings.yaml` +
# `.credentials.yaml`). serde_yaml is archived; this is the maintained fork.
serde_yaml_ng = "0.10"
# Tokenize DSH's !!js tags without changing quoted strings or evaluating them.
yaml-rust2 = { version = "0.11", default-features = false }

# Logging
log = "0.4"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Platform helpers
dirs = "6"
image = "0.25"
fs2 = "0.4"

# SQLite — OpenCode's authoritative session store is `opencode.db`; its
# `storage/` JSON dir is vestigial (only legacy sessions), so we MUST read the
# db to get full history. `bundled` compiles SQLite from source (no system
# libsqlite3). Costs ~0.6 MB in the NSIS installer — worth it for correct data.
rusqlite = { version = "0.32", features = ["bundled"] }

# Crypto (API Key encryption)
aes-gcm = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = "0.12"
sha1 = "0.10"
hmac = "0.12"
sha2 = "0.10"
regex = "1"
md-5 = "0.10"
rsa = { version = "0.9", features = ["pem"] }
hex = "0.4"
ring = "0.17"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "gzip", "multipart", "http2"], default-features = false }
url = "2"
rand = "0.8"
futures-util = "0.3"
flate2 = "1"
semver = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }

# Local HTTP servers for the Anthropic model-id router and smart router.
axum = { version = "0.8", features = ["multipart"] }
cpal = "0.16"
enigo = { version = "0.6", default-features = false, features = ["x11rb", "wayland"] }
tauri-plugin-global-shortcut = "=2.3.1"
http-body-util = "0.1"
bytes = "1"
tokio-stream = "0.1"

# Time
chrono = "0.4"

# SSH client
async-ssh2-tokio = "0.13.0"

# Agent Loop (LLM streaming + cancellation)
reqwest-eventsource = "0.6"
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

# Desktop UX
rfd = "0.17"
which = "8"
# Zstandard decode — DeepSeek Harness persists sessions as `session.jsonl.zstd`
# (concatenated checksummed frames) by default; the "我的AI生涯" scanner
# decompresses them to read the event log. Decode-only use, but the crate's
# libzstd (zstd-sys, bundled C) is the standard multi-frame streaming decoder.
zstd = "0.14.3"

[dev-dependencies]
axum = { version = "0.8", features = ["http2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSGeometry", "NSString", "objc2-core-foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gio = "0.18"
freedesktop-icons = "0.4"
zbus = "5.16"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
x11rb = "0.13"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_Packaging_Appx", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography", "ApplicationModel_Core", "Management_Deployment"] }
raw-window-handle = "0.6"
# Registry scan for tool detection — read DisplayName/InstallLocation/DisplayIcon
# from HKLM + HKCU Uninstall keys so we find apps installed to non-default paths.
winreg = "0.55"

[features]
# Isolated native WebView fixture; ordinary unit tests do not start a GUI runtime.
sdk-native-tests = []
