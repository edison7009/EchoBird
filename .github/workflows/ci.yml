name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt into Node.js 24 runner for all JavaScript-based actions before the
# 2026-06-02 forced switch. setup-node@v4 is still on the Node 20 runner
# by default — flipping this env makes us forward-compatible today.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for changes beyond README and screenshots
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
          rust = True
          if base and base != '0' * 40:
              if os.environ['IS_PULL_REQUEST'] == 'true':
                  base = subprocess.check_output(['git', 'merge-base', base, head], text=True).strip()
              paths = subprocess.check_output(['git', 'diff', '--no-renames', '--name-only', '-z', base, head]).split(b'\0')
              paths = [path for path in paths if path]
              rust = not paths or any(
                  path not in (b'README.md', b'README.zh-CN.md') and not path.startswith(b'docs/screenshots/')
                  for path in paths
              )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'rust={str(rust).lower()}\n')
          PY

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build public website
        run: npm run website:build

      - name: Test public website
        run: npm run website:test

      - name: Security audit (npm)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

  rust:
    needs: changes
    # Skip on Dependabot PRs: Dependabot only opens PRs for GitHub
    # Actions / dependency version bumps (config-only, no rust diff),
    # so the frontend job still runs and the rust job re-runs on the
    # merge commit to main.
    if: ${{ !cancelled() && github.actor != 'dependabot[bot]' && needs.changes.outputs.rust != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      # Pinned to 1.93 to stop new clippy lints in every Rust release
      # (introduced as `-D warnings` failures) from spuriously breaking
      # CI when the dev environment is on an older stable. Bump
      # deliberately when we want to adopt new lints; mirror the change
      # in release.yml so the build matrix stays in lockstep.
      - uses: dtolnay/rust-toolchain@1.93
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf gnome-keyring libsecret-tools libasound2-dev libxkbcommon-dev

      - name: Format check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Test and capture native fixture executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          artifact_log="$RUNNER_TEMP/echobird-test-artifacts.jsonl"
          cargo test --manifest-path src-tauri/Cargo.toml --message-format=json | tee "$artifact_log"
          python3 - "$artifact_log" "$GITHUB_ENV" <<'PY'
          import json
          import os
          import pathlib
          import sys

          manifest = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'src-tauri/Cargo.toml'
          executables = set()
          for line in pathlib.Path(sys.argv[1]).read_text(encoding='utf-8').splitlines():
              try:
                  message = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if (isinstance(message, dict) and message.get('reason') == 'compiler-artifact'
                      and message['target']['name'] == 'echobird_lib'
                      and message['profile']['test']
                      and message.get('executable')
                      and pathlib.Path(message['manifest_path']).resolve() == manifest.resolve()):
                  executables.add(message['executable'])
          if len(executables) != 1:
              raise SystemExit('Expected the exact application library test executable')
          executable = executables.pop()
          if not pathlib.Path(executable).is_file():
              raise SystemExit('Application library test executable is missing')
          with open(sys.argv[2], 'a', encoding='utf-8') as output:
              output.write(f'ECHOBIRD_NATIVE_TEST_EXE={executable}\n')
          PY

      - name: Verify all native account preview packages install
        if: runner.os != 'Windows'
        timeout-minutes: 10
        shell: bash
        run: |
          fixture_test='services::plugin_manager::tests::plugin_live_platform_account_previews_install_as_a_batch'
          "$ECHOBIRD_NATIVE_TEST_EXE" --list --ignored --exact "$fixture_test" | grep -Fx "$fixture_test: test"
          "$ECHOBIRD_NATIVE_TEST_EXE" --ignored --exact "$fixture_test"

      - name: Verify published account catalog installs
        if: runner.os != 'Windows'
        timeout-minutes: 10
        shell: bash
        run: |
          fixture_test='services::plugin_manager::tests::plugin_live_community_account_packages_install_without_executing_code'
          "$ECHOBIRD_NATIVE_TEST_EXE" --list --ignored --exact "$fixture_test" | grep -Fx "$fixture_test: test"
          "$ECHOBIRD_NATIVE_TEST_EXE" --ignored --exact "$fixture_test"

      - name: Verify macOS native credential storage
        if: runner.os == 'macOS'
        timeout-minutes: 5
        shell: bash
        env:
          ECHOBIRD_NATIVE_CREDENTIAL_TEST: '1'
        run: |
          set -euo pipefail
          account='EchoBird Native Storage Test'
          service="$account Safe Storage"
          fixture_keychain="$RUNNER_TEMP/echobird-native-test.keychain-db"
          original_keychains=()
          while IFS= read -r item; do
            item="${item#*\"}"
            item="${item%\"*}"
            original_keychains+=("$item")
          done < <(security list-keychains -d user)
          security create-keychain -p 'fixture-keychain-password' "$fixture_keychain"
          trap 'security list-keychains -d user -s "${original_keychains[@]}" || true; security delete-keychain "$fixture_keychain" >/dev/null 2>&1 || true' EXIT
          security set-keychain-settings -lut 600 "$fixture_keychain"
          security unlock-keychain -p 'fixture-keychain-password' "$fixture_keychain"
          security list-keychains -d user -s "$fixture_keychain" "${original_keychains[@]}"
          security add-generic-password -s "$service" -a "$account" -w 'test-safe-storage-password' -T /usr/bin/security "$fixture_keychain"
          security add-generic-password -s 'EchoBird Native Storage Alternate Test Safe Storage' -a 'EchoBird Native Storage Alternate Test Key' -w 'test-safe-storage-password' -T /usr/bin/security "$fixture_keychain"
          fixture_test='services::electron_storage::tests::reads_native_os_credential_fixture'
          "$ECHOBIRD_NATIVE_TEST_EXE" --list --ignored --exact "$fixture_test" | grep -Fx "$fixture_test: test"
          "$ECHOBIRD_NATIVE_TEST_EXE" --ignored --exact "$fixture_test"

      - name: Verify Linux native credential storage
        if: runner.os == 'Linux'
        shell: bash
        env:
          ECHOBIRD_NATIVE_CREDENTIAL_TEST: '1'
        run: |
          dbus-run-session -- bash -euo pipefail <<'SCRIPT'
          printf 'fixture-keyring-password' | gnome-keyring-daemon --unlock --components=secrets
          trap 'secret-tool clear application "EchoBird Native Storage Test" >/dev/null 2>&1 || true' EXIT
          printf 'test-safe-storage-password' | secret-tool store --label='EchoBird native credential test' application 'EchoBird Native Storage Test'
          fixture_test='services::electron_storage::tests::reads_native_os_credential_fixture'
          "$ECHOBIRD_NATIVE_TEST_EXE" --list --ignored --exact "$fixture_test" | grep -Fx "$fixture_test: test"
          "$ECHOBIRD_NATIVE_TEST_EXE" --ignored --exact "$fixture_test"
          SCRIPT

      - name: Security audit (cargo)
        run: |
          cargo install cargo-audit --locked --quiet || true
          # 4 ignored: quick-xml is only in Tauri's plist/build path; RSA has no
          # patched release and is used only by the explicit SSH client; rkyv is
          # an optional lockfile entry absent from every resolved target graph.
          # Remove an --ignore when its dependency chain gains a fixed release.
          cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195 --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0235
        continue-on-error: true
