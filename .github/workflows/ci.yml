name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt into Node.js 24 runner for all JavaScript-based actions before the
# 2026-06-02 forced switch. setup-node@v4 is still on the Node 20 runner
# by default — flipping this env makes us forward-compatible today.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Security audit (npm)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

  rust:
    # Skip on Dependabot PRs: Dependabot only opens PRs for GitHub
    # Actions / dependency version bumps (config-only, no rust diff),
    # so the frontend job still runs and the rust job re-runs on the
    # merge commit to main.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to 1.93 to stop new clippy lints in every Rust release
      # (introduced as `-D warnings` failures) from spuriously breaking
      # CI when the dev environment is on an older stable. Bump
      # deliberately when we want to adopt new lints; mirror the change
      # in release.yml so the build matrix stays in lockstep.
      - uses: dtolnay/rust-toolchain@1.93
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Format check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Security audit (cargo)
        run: |
          cargo install cargo-audit --locked --quiet || true
          # 7 ignored: transitive deps non-applicable to EchoBird (single-user
          # desktop, no attacker-facing SSH/QUIC/XML services). See
          # project_release_v5.4.3 memory for dep-tree grounding. Remove an
          # --ignore when its dep is bumped past the fixed version.
          cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2026-0074 --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195 --ignore RUSTSEC-2026-0185 --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0154 --ignore RUSTSEC-2026-0153
        continue-on-error: true
