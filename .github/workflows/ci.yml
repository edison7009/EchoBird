name: Public website CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run website:build
