name: macOS ARM Release Fallback

# Use an Intel Mac when hosted Apple Silicon runners cannot acquire capacity.
# Build the existing release tag; never replace its source or publish the draft.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing draft release tag (for example v6.1.9)'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'edison7009/EchoBird' && github.ref == 'refs/heads/main'
    runs-on: macos-26-intel
    defaults:
      run:
        working-directory: release-source
    steps:
      - name: Checkout public workflow
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Checkout desktop source
        id: source
        uses: ./.github/actions/checkout-release-source
        with:
          tag: ${{ inputs.tag }}
          deploy-key: ${{ secrets.ECHOBIRD_CORE_DEPLOY_KEY }}

      - name: Validate tag and resolve existing draft
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ID=$(gh api --paginate "repos/${REPO}/releases" \
            --jq ".[] | select(.tag_name == \"${TAG}\" and .draft == true) | .id")
          test -n "$ID"
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"

      # AppKit chooses traffic-light metrics from the linked SDK. SDK 15
      # produces smaller buttons centered at y=24 with our inset; SDK 26+
      # matches Coffee CLI and the 40px frontend titlebar (center y=20).
      - name: Require modern macOS SDK for native window controls
        run: |
          set -euo pipefail
          SDK_VERSION="$(xcrun --sdk macosx --show-sdk-version)"
          if [[ "${SDK_VERSION%%.*}" -lt 26 ]]; then
            echo "::error::macOS SDK 26+ is required for correctly sized and aligned native window buttons (found $SDK_VERSION)."
            exit 1
          fi
          echo "Building with macOS SDK $SDK_VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@1.93
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        shell: bash
        run: |
          if ! npm ci > "$RUNNER_TEMP/echobird-npm.log" 2>&1; then
            echo "::error::Desktop dependency installation failed. Check the source in the private repository."
            exit 1
          fi

      - name: Verify Antigravity OAuth build credentials
        env:
          ANTIGRAVITY_OAUTH_CLIENT_ID: ${{ secrets.ANTIGRAVITY_OAUTH_CLIENT_ID }}
          ANTIGRAVITY_OAUTH_CLIENT_SECRET: ${{ secrets.ANTIGRAVITY_OAUTH_CLIENT_SECRET }}
        run: test -n "$ANTIGRAVITY_OAUTH_CLIENT_ID" && test -n "$ANTIGRAVITY_OAUTH_CLIENT_SECRET"

      - name: Package ARM release and upload to existing draft
        uses: ./.github/actions/macos-release
        with:
          target: aarch64-apple-darwin
          tag: ${{ inputs.tag }}
        env:
          ANTIGRAVITY_OAUTH_CLIENT_ID: ${{ secrets.ANTIGRAVITY_OAUTH_CLIENT_ID }}
          ANTIGRAVITY_OAUTH_CLIENT_SECRET: ${{ secrets.ANTIGRAVITY_OAUTH_CLIENT_SECRET }}
          ECHOBIRD_MACOS_SIGNED: ${{ vars.ECHOBIRD_MACOS_SIGNED == 'true' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          ECHOBIRD_UPDATER_PUBLIC_KEY: ${{ vars.ECHOBIRD_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
