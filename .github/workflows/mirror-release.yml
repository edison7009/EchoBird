name: Mirror release to China

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to mirror (for example v6.2.0)
        required: false

permissions:
  contents: read

concurrency:
  group: mirror-release
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_ASSETS: 8
    steps:
      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$tag" ]; then tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName); fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download installers and verify digests
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          mkdir -p out
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > release.json
          test "$(jq -r .draft release.json)" != true
          jq -r '.assets[] | select(.name | test("\\.(exe|msi|dmg|deb|rpm)$")) | .name' release.json > names.txt
          test "$(wc -l < names.txt | tr -d ' ')" -ge "$EXPECTED_ASSETS"
          while read -r name; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir out --clobber
            want=$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .digest // ""' release.json | sed 's/^sha256://')
            got=$(sha256sum "out/$name" | cut -d' ' -f1)
            test -n "$want" && test "$want" = "$got" && test -s "out/$name"
          done < names.txt

      - name: Build mirror commit
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"; version="${tag#v}"; cd out
          jq -n --arg version "$version" --arg tag "$tag" \
            --arg published "$(jq -r .published_at ../release.json)" \
            --arg notes "$(jq -r '.body // ""' ../release.json)" \
            --arg source "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" \
            '{version:$version,tag:$tag,releaseDate:$published,publishedAt:$published,releaseNotes:$notes,source:$source,files:{}}' > manifest.json
          while read -r name; do
            size=$(stat -c %s "$name"); sha=$(sha256sum "$name" | cut -d' ' -f1)
            jq --arg n "$name" --argjson s "$size" --arg h "$sha" '.files[$n]={size:$s,sha256:$h}' manifest.json > m.tmp && mv m.tmp manifest.json
          done < ../names.txt
          printf '# EchoBird installers (%s)\n\nDownload-only mirror of the official release.\n' "$tag" > README.md
          git init -q -b main; git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A; git commit -q -m "EchoBird $tag installers"

      - name: Push to CNB
        id: cnb
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PYCNB'
          import json, os, urllib.request, urllib.error
          token = os.environ['TOKEN']
          if not token: raise SystemExit('CNB_TOKEN is missing')
          headers = {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'}
          url = 'https://api.cnb.cool/echobird/echobird-releases'
          try:
              urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30).close()
          except urllib.error.HTTPError as error:
              if error.code != 404: raise SystemExit(f'CNB repository lookup failed (HTTP {error.code}); check token scope')
              request = urllib.request.Request('https://api.cnb.cool/echobird/-/repos', headers=headers,
                  data=json.dumps({'name': 'echobird-releases', 'visibility': 'public',
                      'description': 'Official EchoBird installer mirror'}).encode(), method='POST')
              try: urllib.request.urlopen(request, timeout=30).close()
              except urllib.error.HTTPError as error: raise SystemExit(f'CNB repository creation failed (HTTP {error.code}); verify echobird organization and token permission')
          PYCNB
          auth=$(printf 'cnb:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          cd out
          for i in 1 2 3; do git -c http.extraHeader="Authorization: Basic $auth" push --force https://cnb.cool/echobird/echobird-releases.git main && exit 0; sleep $((i*15)); done; exit 1

      - name: Push to GitCode
        id: gitcode
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PYGITCODE'
          import json, os, urllib.request, urllib.error, urllib.parse
          token = os.environ['TOKEN']
          if not token: raise SystemExit('GITCODE_TOKEN is missing')
          query = urllib.parse.urlencode({'access_token': token})
          root = 'https://api.gitcode.com/api/v5'
          def request(path, data=None):
              req = urllib.request.Request(root + path + '?' + query, data=data,
                  headers={'Accept': 'application/json'})
              return urllib.request.urlopen(req, timeout=30)
          try:
              with request('/user') as response: user = json.load(response)
          except urllib.error.HTTPError as error: raise SystemExit(f'GitCode token validation failed (HTTP {error.code})')
          if user.get('login') != 'edison7009': raise SystemExit('GitCode token belongs to a different owner; mirror expects edison7009')
          try: request('/repos/edison7009/echobird-releases').close()
          except urllib.error.HTTPError as error:
              if error.code != 404: raise SystemExit(f'GitCode repository lookup failed (HTTP {error.code})')
              data = urllib.parse.urlencode({'name': 'echobird-releases', 'path': 'echobird-releases',
                  'private': 'false', 'description': 'Official EchoBird installer mirror'}).encode()
              try: request('/user/repos', data).close()
              except urllib.error.HTTPError as error: raise SystemExit(f'GitCode repository creation failed (HTTP {error.code}); check token scope')
          PYGITCODE
          auth=$(printf 'edison7009:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          cd out
          for i in 1 2 3; do git -c http.extraHeader="Authorization: Basic $auth" push --force https://gitcode.com/edison7009/echobird-releases.git main && exit 0; sleep $((i*15)); done; exit 1

      - name: Check mirrors serve the files
        if: always()
        run: |
          set -uo pipefail; name=$(head -1 names.txt); want=$(jq -r --arg n "$name" '.files[$n].sha256' out/manifest.json); bad=0
          check() { got=$(curl -fsL --retry 3 "$2" | sha256sum | cut -d' ' -f1); [ "$got" = "$want" ] || bad=1; }
          [ "${{ steps.cnb.outcome }}" = success ] && check cnb "https://cnb.cool/echobird/echobird-releases/-/git/raw/main/$name"
          [ "${{ steps.gitcode.outcome }}" = success ] && check gitcode "https://api.gitcode.com/api/v5/repos/edison7009/echobird-releases/raw/$name?ref=main"
          [ "${{ steps.cnb.outcome }}" = success ] && [ "${{ steps.gitcode.outcome }}" = success ] && [ "$bad" = 0 ]
