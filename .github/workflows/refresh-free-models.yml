name: Refresh Free Model Catalog

on:
  schedule:
    # 11:35 and 23:35 Asia/Shanghai. Keep existing entries and append verified discoveries.
    - cron: '35 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-free-model-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install verifier dependency
        run: python -m pip install --quiet cryptography

      - name: Test catalog maintainer
        run: python -m unittest discover -s scripts/tests -p 'test_refresh_free_models.py'

      - name: Refresh verified catalog entries
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: >-
          python scripts/refresh_free_models.py
          --catalog docs/api/free-models/index.json
          --report "${{ runner.temp }}/free-model-catalog-report.json"

      - name: Upload maintenance report
        uses: actions/upload-artifact@v7
        with:
          name: free-model-catalog-report
          path: ${{ runner.temp }}/free-model-catalog-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api/free-models/index.json
          if git diff --cached --quiet; then
            echo "No verified catalog changes — skipping commit."
            exit 0
          fi
          git commit -m "chore(catalog): refresh verified model directory"
          # A concurrent edit rejects this push; the next run merges from latest main.
          git push origin HEAD:main
